spring.application.name=barili-survey-api
server.port=${PORT:8080}
survey.admin-username=${SURVEY_ADMIN_USERNAME:}
survey.admin-password-hash=${SURVEY_ADMIN_PASSWORD_HASH:}
survey.admin-cookie-secure=${SURVEY_ADMIN_COOKIE_SECURE:true}
survey.admin-cookie-same-site=${SURVEY_ADMIN_COOKIE_SAME_SITE:Lax}
survey.public-base-url=${SURVEY_PUBLIC_BASE_URL:http://localhost:3000}

spring.datasource.url=${DB_URL:jdbc:h2:file:./data/barili-survey;MODE=PostgreSQL;AUTO_SERVER=TRUE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.flyway.enabled=${FLYWAY_ENABLED:false}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.h2.console.enabled=false
spring.jackson.serialization.write-dates-as-timestamps=false
