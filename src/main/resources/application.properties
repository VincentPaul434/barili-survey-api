spring.application.name=barili-survey-api
server.port=${PORT:8080}
survey.admin-cookie-secure=${SURVEY_ADMIN_COOKIE_SECURE:false}
survey.public-base-url=${SURVEY_PUBLIC_BASE_URL:http://localhost:3000}

spring.datasource.url=${DB_URL:jdbc:h2:file:./data/barili-survey;MODE=PostgreSQL;AUTO_SERVER=TRUE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.h2.console.enabled=true
spring.jackson.serialization.write-dates-as-timestamps=false
